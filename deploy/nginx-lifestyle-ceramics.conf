server {
    server_name lyfestyleceramics.co.za www.lyfestyleceramics.co.za;

    root /opt/lifestyle-ceramics/public;
    access_log /var/log/nginx/lifestyle-ceramics-access.log;
    error_log /var/log/nginx/lifestyle-ceramics-error.log;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The admin panel is updated often; never let the browser (or any
    # CDN) serve a stale copy that drifts out of sync with the backend's
    # current API contract.
    location = /admin.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lyfestyleceramics.co.za/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lyfestyleceramics.co.za/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.lyfestyleceramics.co.za) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = lyfestyleceramics.co.za) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name lyfestyleceramics.co.za www.lyfestyleceramics.co.za;
    return 404; # managed by Certbot




}